<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <!-- Faz a página se adaptar corretamente a celulares e tablets -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pokédex</title>

    <!-- Estilos gerais -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Partes da interface -->
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/controles.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/modal.css">

    <!-- Responsividade por último -->
    <link rel="stylesheet" href="css/responsivo.css">
</head>

<body>

    <!-- Cabeçalho principal da Pokédex -->
    <header class="cabecalho">

        <div class="cabecalho-conteudo">

            <!-- Título com ícone de Pokébola -->
            <div class="titulo-pokedex">

                <div
                    class="icone-pokebola"
                    aria-hidden="true"
                >
                    <div class="centro-pokebola"></div>
                </div>

                <h1>Pokédex</h1>

            </div>

            <p class="subtitulo-pokedex">
                Descubra e explore o mundo dos Pokémon
            </p>

            <!-- Geração disponível atualmente -->
            <span class="geracao-atual">
                Kanto • #001 — #151
            </span>

        </div>

    </header>


    <!-- Conteúdo principal -->
    <main>

        <!-- Pesquisa, filtro e ordenação -->
        <section
            class="controles"
            aria-label="Controles da Pokédex"
        >

            <input
                type="search"
                id="busca-pokemon"
                placeholder="Pesquisar Pokémon..."
                aria-label="Pesquisar Pokémon"
                autocomplete="off"
            >

            <select
                id="filtro-tipo"
                aria-label="Filtrar Pokémon por tipo"
            >
                <option value="todos">
                    Todos os tipos
                </option>
            </select>

            <select
                id="ordenacao"
                aria-label="Ordenar Pokémon"
            >
                <option value="numero">
                    Número
                </option>

                <option value="nome-az">
                    Nome A-Z
                </option>

                <option value="nome-za">
                    Nome Z-A
                </option>
            </select>

        </section>


        <!-- Cards criados dinamicamente pelo JavaScript -->
        <section
            class="lista-pokemon"
            id="lista-pokemon"
            aria-label="Lista de Pokémon"
        >
        </section>

    </main>


    <!-- Modal com detalhes do Pokémon -->
    <div
        class="modal"
        id="modal-pokemon"
        role="dialog"
        aria-modal="true"
        aria-label="Detalhes do Pokémon"
        aria-hidden="true"
        tabindex="-1"
    >

        <div class="modal-conteudo">

            <button
                id="fechar-modal"
                type="button"
                aria-label="Fechar detalhes"
            >
                ×
            </button>

            <!-- Conteúdo preenchido dinamicamente -->
            <div id="detalhes-pokemon">
            </div>

        </div>

    </div>


    <!-- Arquivo JavaScript principal -->
    <script
        type="module"
        src="js/main.js"
    ></script>

</body>

</html>
